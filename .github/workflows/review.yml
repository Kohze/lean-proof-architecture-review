name: Review package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curated-sources-examples-and-manuscript:
    name: Curated bytes, original Lean examples, and manuscript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      TZ: UTC
    steps:
      - name: Check out the manuscript package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Clear retained outputs before generating CI evidence
        id: fresh_outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          patterns = [
              'lean-proof-architecture.pdf',
              'results/lean-compiler.log', 'results/verification.json',
              'results/worked-examples.json', 'audit/source-integrity.json',
              'audit/depth-evidence-verification.json',
              'audit/method-survey-verification.json',
              'audit/build.json', 'audit/build-pass-*.log', 'audit/latex-final.log',
              'audit/bibliography-build.log', 'audit/references-rendered.bbl',
              'audit/final-audit.json',
          ]
          for pattern in patterns:
              for path in root.glob(pattern):
                  path.unlink()
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify curated upstream bytes against pinned hashes
        run: python reproduce/verify_sources.py

      - name: Verify proof-body evidence and manuscript source locators
        run: python reproduce/verify_depth_evidence.py

      - name: Verify sampled source bytes, extraction fixtures, and method data
        run: python reproduce/verify_method_profile.py

      - name: Recompute joint subject and length standardization
        run: |
          python reproduce/audit_completeness.py
          git diff --exit-code -- research/method-survey/joint-standardization.json research/method-survey/joint-comparison.csv method-profile-joint-table.tex

      - name: Install elan and Lean 4.34.1
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.1

      - name: Compile original examples and run exact finite checks
        run: python reproduce/verify_examples.py

      - name: Install the manuscript TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Reassemble citations from retained primary metadata
        run: |
          python reproduce/assemble_references.py
          git diff --exit-code -- references.bib

      - name: Build and check citations, diagnostics, and PDF
        run: |
          python reproduce/build.py
          python reproduce/verify_manuscript.py

      # This job verifies curated file identity and the review's own examples.
      # It does not build the upstream endpoint theorems or run Comparator.
      - name: Retain fresh verification evidence and rebuilt PDF
        if: ${{ always() && steps.fresh_outputs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-package-checks
          if-no-files-found: warn
          retention-days: 14
          path: |
            lean-proof-architecture.pdf
            results/lean-compiler.log
            results/verification.json
            results/worked-examples.json
            audit/source-integrity.json
            audit/depth-evidence-verification.json
            audit/method-survey-verification.json
            audit/completeness-sensitivity-2026-10-08.json
            audit/build.json
            audit/build-pass-*.log
            audit/latex-final.log
            audit/bibliography-build.log
            audit/references-rendered.bbl
            audit/final-audit.json
